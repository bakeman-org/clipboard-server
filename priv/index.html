<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>剪贴板历史</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --border: #e3e6ea;
    --text: #24292f;
    --muted: #6a737d;
    --accent: #2f81f7;
    --danger: #d1242f;
    --pill-bg: #eef1f5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.65;
    font-size: 17px;
  }
  header {
    padding: 24px 32px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  h1 {
    margin: 0 0 16px;
    font-size: 26px;
    font-weight: 600;
    letter-spacing: .3px;
  }
  .toolbar {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  input[type=text] {
    flex: 1 1 300px;
    min-width: 220px;
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 17px;
    outline: none;
    background: #fff;
    transition: border-color .15s, box-shadow .15s;
  }
  input[type=text]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(47,129,247,.15);
  }
  button {
    padding: 10px 18px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--text);
    font-size: 16px;
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  button:hover { background: #f0f2f5; }
  button.primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  button.primary:hover { background: #1f6feb; }
  button.danger {
    color: var(--danger);
    border-color: #f5c2c7;
  }
  button.danger:hover { background: #ffeef0; }

  /* ---------- 示例 pill 区 ---------- */
  .examples {
    margin-top: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    font-size: 14px;
    color: var(--muted);
  }
  .examples-label {
    font-size: 14px;
    color: var(--muted);
    margin-right: 4px;
  }
  .pill {
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--pill-bg);
    color: var(--text);
    font-size: 14px;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    cursor: pointer;
    transition: all .15s;
    line-height: 1.2;
  }
  .pill:hover {
    background: #fff;
    border-color: var(--accent);
    color: var(--accent);
    transform: translateY(-1px);
  }
  .pill.pill-reset {
    background: #fff;
    color: var(--muted);
  }
  .pill.pill-reset:hover {
    color: var(--danger);
    border-color: #f5c2c7;
  }

  main { padding: 24px 32px 64px; max-width: 1100px; margin: 0 auto; }

  .meta {
    color: var(--muted);
    font-size: 15px;
    margin-bottom: 16px;
  }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 64px 24px;
    background: var(--card);
    border: 1px dashed var(--border);
    border-radius: 10px;
    font-size: 17px;
  }

  .item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 14px;
    display: flex;
    gap: 16px;
    align-items: flex-start;
    transition: border-color .15s, box-shadow .15s;
  }
  .item:hover {
    border-color: #c8ccd1;
    box-shadow: 0 1px 3px rgba(0,0,0,.04);
  }
  .item .content {
    flex: 1;
    white-space: pre-wrap;
    word-break: break-word;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 16px;
    line-height: 1.6;
  }
  .item .side {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
    flex-shrink: 0;
  }
  .item .ts {
    color: var(--muted);
    font-size: 14px;
    white-space: nowrap;
    font-family: ui-monospace, monospace;
  }
  .item .actions button {
    padding: 6px 12px;
    font-size: 14px;
    border-radius: 6px;
  }
  mark {
    background: #fff5b1;
    color: inherit;
    padding: 0 2px;
    border-radius: 3px;
  }
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: #24292f;
    color: #fff;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 15px;
    opacity: 0;
    transition: opacity .2s;
    pointer-events: none;
    box-shadow: 0 4px 16px rgba(0,0,0,.15);
  }
  .toast.show { opacity: .94; }

  /* 小屏幕微调 */
  @media (max-width: 640px) {
    header { padding: 16px 18px; }
    h1 { font-size: 22px; }
    main { padding: 16px 18px 48px; }
    .item { flex-direction: column; }
    .item .side { align-self: flex-end; }
  }
</style>
</head>
<body>

<header>
  <h1>📋 剪贴板历史</h1>
  <div class="toolbar">
    <input id="search" type="text"
           placeholder="输入关键字过滤（grep 风格，支持 % 和 _ 通配符）">
    <button id="btn-refresh">刷新</button>
    <button id="btn-clear" class="danger">清空</button>
  </div>

  <div class="examples">
    <span class="examples-label">示例：</span>
    <button class="pill" data-q="hello"          title="包含 hello 的记录">hello</button>
    <button class="pill" data-q="%历史"          title="以“历史”结尾的记录">%历史</button>
    <button class="pill" data-q="剪%"            title="以“剪”开头的记录">剪%</button>
    <button class="pill" data-q="剪___"          title="“剪”后跟任意 3 个字符">剪___</button>
    <button class="pill" data-q="http%com"       title="http 与 com 之间任意内容（例如 URL）">http%com</button>
    <button class="pill" data-q="error"          title="包含 error 的记录">error</button>
    <button class="pill" data-q="%"              title="匹配所有非空记录">%</button>
    <button class="pill pill-reset" data-q=""    title="清空过滤条件，显示全部">清空</button>
  </div>
</header>

<main>
  <div class="meta" id="meta">加载中…</div>
  <div id="list"></div>
</main>

<div class="toast" id="toast"></div>

<script>
(() => {
  const $search  = document.getElementById("search");
  const $list    = document.getElementById("list");
  const $meta    = document.getElementById("meta");
  const $refresh = document.getElementById("btn-refresh");
  const $clear   = document.getElementById("btn-clear");
  const $toast   = document.getElementById("toast");

  let currentQuery = "";

  function toast(msg) {
    $toast.textContent = msg;
    $toast.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => $toast.classList.remove("show"), 1800);
  }

  function fmtTime(ms) {
    const d = new Date(ms);
    const pad = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} `
         + `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }

  function esc(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  // 高亮：去掉 %/_ 通配后按子串高亮
  function highlight(text, q) {
    if (!q) return esc(text);
    const plain = q.replace(/[%_]/g, "");
    if (!plain) return esc(text);
    const idx = text.toLowerCase().indexOf(plain.toLowerCase());
    if (idx < 0) return esc(text);
    return esc(text.slice(0, idx))
         + "<mark>" + esc(text.slice(idx, idx + plain.length)) + "</mark>"
         + esc(text.slice(idx + plain.length));
  }

  async function fetchJSON(url, opts) {
    const r = await fetch(url, opts);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  }

  async function load(q) {
    currentQuery = q || "";
    $meta.textContent = "加载中…";
    try {
      const url = currentQuery
        ? `/api/history/search?q=${encodeURIComponent(currentQuery)}`
        : `/api/history`;
      const res = await fetchJSON(url);
      if (!res.ok) throw new Error(res.error || "未知错误");
      render(res.data);
      $meta.textContent = currentQuery
        ? `匹配 “${currentQuery}” 的记录：${res.data.length} 条`
        : `共 ${res.data.length} 条记录`;
    } catch (e) {
      $meta.textContent = "加载失败：" + e.message;
      $list.innerHTML = "";
    }
  }

  function render(items) {
    if (!items.length) {
      $list.innerHTML = `<div class="empty">暂无记录</div>`;
      return;
    }
    $list.innerHTML = items.map(it => `
      <div class="item">
        <div class="content">${highlight(it.content, currentQuery)}</div>
        <div class="side">
          <div class="ts">#${it.id} · ${fmtTime(it.created_at)}</div>
          <div class="actions">
            <button data-act="copy" data-text="${esc(it.content)}">复制</button>
          </div>
        </div>
      </div>
    `).join("");
  }

  // 事件：搜索框输入（防抖 200ms）
  $search.addEventListener("input", () => {
    clearTimeout($search._t);
    $search._t = setTimeout(() => load($search.value.trim()), 200);
  });

  // 示例 pill 点击 → 填入搜索框并立即过滤
  document.querySelectorAll(".pill").forEach(p => {
    p.addEventListener("click", () => {
      const q = p.getAttribute("data-q") || "";
      $search.value = q;
      load(q);
      $search.focus();
    });
  });

  $refresh.addEventListener("click", () => load($search.value.trim()));

  $clear.addEventListener("click", async () => {
    if (!confirm("确定清空全部剪贴板历史？此操作不可撤销。")) return;
    try {
      const res = await fetchJSON("/api/clear", { method: "DELETE" });
      if (!res.ok) throw new Error(res.error || "未知错误");
      toast("已清空");
      load("");
      $search.value = "";
    } catch (e) {
      toast("清空失败：" + e.message);
    }
  });

  // 复制按钮 → 写回系统剪贴板
  $list.addEventListener("click", async e => {
    const btn = e.target.closest("button[data-act=copy]");
    if (!btn) return;
    const text = btn.getAttribute("data-text") || "";
    try {
      const res = await fetchJSON("/api/clipboard", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ text })
      });
      if (!res.ok) throw new Error(res.error || "未知错误");
      toast("已写回剪贴板");
    } catch (err) {
      toast("写入失败：" + err.message);
    }
  });

  // 自动刷新：每 2 秒拉一次（页面隐藏时暂停）
  setInterval(() => {
    if (!document.hidden) {
      load($search.value.trim());
    }
  }, 2000);

  // 初次加载
  load("");
})();
</script>
</body>
</html>
